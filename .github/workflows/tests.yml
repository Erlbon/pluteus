name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit; the version is the comment behind each. To move one: gh api repos/OWNER/NAME/commits/TAG --jq .sha

jobs:
  # The newest versions pyproject.toml allows, on the oldest Python that is supported, the one that is shipped, and the newest.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install bsdtar (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  # Exactly the versions the exe and the Docker image are built from (requirements-build.lock, Python 3.12).
  locked:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Install bsdtar (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - run: python -m pytest -q

  # The tests that drive a real browser (tests/*_browser.py). They skip themselves where Playwright or Chrome is missing;
  # here a skip is a failure, so a green run means the reader and player tests really ran.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bsdtar, and ffmpeg (the video tests make their test videos with it)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools ffmpeg
      - run: python -m pip install ".[dev,browser]"
      - name: Google Chrome (the tests start it by its channel name; the runner image has it, otherwise Playwright installs it)
        run: google-chrome --version || python -m playwright install --with-deps chrome
      - name: Browser tests
        run: python -m pytest -q -rs --junitxml=browser-tests.xml tests/*_browser.py
      - name: A skipped browser test fails the job
        run: python tools/check_no_skips.py browser-tests.xml
