# Example. In config.toml set host = "0.0.0.0", data_dir = "/data" and use the container paths below.
#
# Tested on Docker Desktop (Windows): builds, starts healthy, serves, keeps state across restarts (see README).
#
# Mount the config FOLDER, not the single file: `pluteus user ...` saves by replacing the file, and on Linux hosts
# Docker can keep a single-file mount pointing at the old one (not seen on Docker Desktop for Windows).
# Mount it read-write if you manage users from inside the container (docker compose exec pluteus ...);
# read-only is fine if you only edit the file on the host.
#
# On Windows, bind-mounting a Windows drive into Docker Desktop goes through the WSL2 file-sharing layer, which is
# slow for folder walks: benchmark before choosing Docker over running pluteus natively (see README). A named
# volume for /data (below) is the safe default.
services:
  pluteus:
    build: .
    # How the port is reached (pick one; see docs/running.md):
    #  - directly on the LAN:                          "8080:8080"
    #  - behind a Caddy that reaches the host
    #    (host.docker.internal:8100):                  "8100:8080"
    #  - behind a Caddy on the same Docker network:    no ports at all, Caddy uses pluteus:8080
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - pluteus-data:/data
      # Personal upload folders (config: uploads_dir = "/uploads"). Needs to be writable; keep it a SEPARATE folder
      # from the libraries so you can look through what arrives before moving it in.
      # - /path/to/uploads:/uploads
      - /path/to/books:/library/books:ro
      - /path/to/comics:/library/comics:ro
    restart: unless-stopped
    # Hardening: the app needs no privileges, no writable image and no more than a small, bounded share of the box.
    # (SQLite and the metadata cache write to /data, which is a volume, so a read-only root filesystem is fine;
    # /tmp is given as a tmpfs for libraries that want it.)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g

volumes:
  pluteus-data:
