# pluteus configuration. Copy to config.toml (git-ignored) and edit.
# Check it with:  python -m pluteus check-config --config config.toml
#
# TOML rule worth knowing: a key belongs to the [table] header ABOVE it. Every setting below lives
# in [server], so keep them there. A setting typed under [[roots]] or [[users]] is refused with an
# error, never silently ignored.

[server]
host = "127.0.0.1"          # use "0.0.0.0" inside Docker or to serve the whole LAN
port = 8080
page_size = 50              # entries per OPDS / web page
# base_path = "/library"    # only when served under a prefix by a reverse proxy
# auth_cache_seconds = 300  # successful logins are remembered this long (reader apps send credentials on every request)
# anonymous_user = "guest"  # OFF by default. Requests that send NO credentials act as this user, for reader apps
#                           # that cannot log in. Wrong credentials are still refused. Give that user few roots
#                           # and never adult = true, and do not expose this to the internet.

# relay = false      # OFF by default. true: a radio station a browser cannot play directly (plain http on an https site, or a server that refuses the browser)
#                    # goes through this server instead. Only for users with an upload folder; at most relay_streams_user streams per user and
#                    # relay_streams_total in all are open at once (defaults 2 and 6). Uses the server's upload bandwidth.
# relay_streams_user = 2
# relay_streams_total = 6

# opds_pse = true           # OPDS page-streaming links so Android comic apps can read a CBZ page by page; reads each
#                           # comic's page list once per feed page (cached). Set false to turn off.

# show_all_files = true     # list and open every file (images, text, audio, video, anything). false = books-only server:
#                           # only the types in `extensions` are listed or served. OPDS feeds always list books only.
#                           # With true, data_dir / cache_dir / themes_dir and this config file must NOT be inside a root.
# text_view_kb = 1024       # the text viewer shows at most this many KB of a file (the rest is a download)

# WHERE STATE LIVES. Set data_dir for a real install: it holds logins (sessions), reading progress, user
# preferences and the hourly backups. Without it all of that is kept in memory and lost on every restart
# (the server prints a warning). Keep it OUTSIDE the library folders. In Docker it is /data.
data_dir = 'D:\pluteus-data'

# ADMIN PAGE (local network only). A web page on its OWN port for status, locks/known devices and users. Off unless
# admin_port is set; needs at least one user with `admin = true`. Never route or forward this port to the internet
# (a reverse proxy that routes only the main port does not expose it). In Docker use admin_host = "0.0.0.0" and publish
# the port on the LAN address only.
# admin_port = 8101
# admin_host = "127.0.0.1"
# The admin page links back to the normal site on the same host name. If the site is published under another port than
# `port` (Docker: 8080 inside, 8100 outside), say which one:
# site_port = 8100
# The Admin link in the top bar appears for an administrator who opens the site directly on the local network, never through a
# proxy. If your LAN-only site sits behind a proxy (e.g. https://pluteus.lan), say where the admin page is and the link always shows
# for administrators:
# admin_url = "http://pluteus.lan:8101/"

# LIBRARIES CAN BE ADDED ON THE ADMIN PAGE (Libraries tab), no file editing: type the folder or pick it with the folder picker. The
# picker lists folders for a browser on the SAME computer (the Windows and Linux programs). In Docker, mount the folders in
# docker-compose.yml and list a parent of them here to turn the picker on below it:
# library_bases = ["/library"]

# UPDATE AND SECURITY CHECK (opt-in, off by default). With update_check = true the admin page asks GitHub (api.github.com) once a
# day, in the background, for the newest tag and the published security advisories of update_repo, and shows a green / yellow / red
# dot beside the version. Nothing about your library or users is sent; GitHub sees this server's address. It never updates anything.
# update_check = true
# update_repo = "Erlbon/pluteus"

# The installed app (Android, Chrome: Install app) appears in the Share menu when uploads_dir is set. If Chrome cannot install the
# app, try share_target = false (and restart): it leaves the share entry out of the manifest.
# share_target = true

# MORE WAYS IN, all off until switched on (each needs an app key for the user: admin page, Users, Edit, Make a key):
# subsonic = true            # Subsonic / OpenSubsonic API under /rest: music apps (Symfonium, Tempo, ...) and Android Auto through them
# webdav = true              # read-only WebDAV under /dav: mount the library in Explorer, Finder, Android file managers, Kodi
# kosync = true              # KOReader progress sync under /kosync
# thumbnails = true          # cover thumbnails: cover links in the OPDS feeds and the cover view of folders (needs Pillow, installed with pluteus)

# PERSONAL UPLOAD FOLDERS. Set uploads_dir and every user gets their own folder uploads_dir/<user name>, shown as the
# top-level folder "uploads": upload, new folder, rename, delete. Nobody else sees it (not even other users with the
# same roots) and it is never inside a library: you move files into the library yourself. Keep uploads_dir OUTSIDE
# every root and outside data_dir. User names become folder names (letters, digits, space, - _ . only); give a user
# `upload = false` to leave them out. The anonymous_user never gets one. Off when the line is missing.
# uploads_dir = 'D:\pluteus-uploads'
# upload_max_mb = 4096       # largest single file
# upload_quota_mb = 0        # most one user may keep; 0 = no limit (the disk is also kept 512 MB from full)

# Look and sessions. Themes are folders of CSS under themes_dir (built-in: default, sepia, night, northernlights).
# theme = "default"          # the theme for the login page and for users who have not chosen one
# themes_dir = 'D:\pluteus-themes'
# session_days = 30          # how long a browser stays signed in
# cookie_secure = "auto"     # "auto" (follow the request), "always" or "never". Use "always" behind HTTPS.
# trust_proxy = false        # true ONLY behind a reverse proxy you control (Caddy, nginx): then X-Forwarded-For /
#                            # X-Forwarded-Proto are believed, for the client address and the secure-cookie decision.
# allowed_hosts = ["books.example.org"]   # only if logins/uploads answer 403 behind your proxy: the proxy rewrites the
#                            # Host header, so list the public host name the browser really uses (trust_proxy = true
#                            # also accepts X-Forwarded-Host)
# base_path = "/library"     # (see above) works whether or not the proxy strips the prefix
# realm = "pluteus"         # the name shown in the browser's / app's login prompt

# EPUB metadata (title, authors, series, language, year) is read from inside each book, only for the
# books on the page being shown, and cached in a disposable SQLite file (safe to delete at any time).
# metadata = true
# cache_dir = 'D:\pluteus-cache'   # where that cache lives; leave out to keep it in data_dir

# Folder or file names to hide anywhere (case-insensitive), on top of the built-in list
# (Recycle Bin, Thumbs.db, ...). Names starting with a dot are always hidden.
exclude = ["_incoming", "_Quarantine", "_sort", "_Trash Folder", "_Thrash"]

# File types that are listed and downloadable.
extensions = [".epub", ".cbz", ".pdf"]

# Leading numbers such as "3.23 - " or "0. " are removed from FOLDER display names
# (sorting still uses the real name). Set to "" to show names untouched.
# display_strip = '^\d+(?:\.\d+)*(?: - |\.\s+)'

# A folder containing a file with this name (and everything below it) is hidden from
# users who do not have adult = true. Hidden folders answer 404, like missing ones.
adult_marker = ".adult"

# A folder with a file of this name (and everything below it) is only for the users named inside the file, one name
# per line. Everyone else gets 404. An empty file names nobody.
private_marker = ".private"

# A folder with a file of this name is left out of listings and feeds (a direct link still works), except for any
# users named inside it.
hidden_marker = ".hidden"

# Folders to serve. The folder tree is read live from disk; nothing is indexed up front.
# Names appear in URLs, so use letters, digits, - and _ only.
[[roots]]
name = "books"
path = 'D:\Library\Books'

[[roots]]
name = "comics"
path = 'E:\Library\Comics'

# Users. Manage them with the CLI instead of editing by hand:
#   python -m pluteus user add NAME --config config.toml
#   python -m pluteus user set NAME --adult | --roots books,comics | --password
#   python -m pluteus user list | remove NAME
# A running server picks up user changes within a few seconds.
[[users]]
name = "alice"
password_hash = "scrypt$16384$8$1$replace-with-output-of-hash-password"
adult = true
roots = ["*"]               # every root, also ones added later. WITHOUT a roots list a user may open NO folders.

[[users]]
name = "guest"
password_hash = "scrypt$16384$8$1$replace-with-output-of-hash-password"
roots = ["books"]           # only these roots; ["*"] = every root; no list = none
# upload = false            # no personal upload folder for this user (when uploads_dir is set)
# admin = true              # may sign in to the admin page (needs admin_port). Off by default.
