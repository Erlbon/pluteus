# pluteus configuration. Copy to config.toml (git-ignored) and edit.
# Check it with:  python -m pluteus check-config --config config.toml
#
# TOML rule worth knowing: a key belongs to the [table] header ABOVE it. Every setting below lives
# in [server], so keep them there. A setting typed under [[roots]] or [[users]] is refused with an
# error, never silently ignored.

[server]
host = "127.0.0.1"          # use "0.0.0.0" inside Docker or to serve the whole LAN
port = 8080
page_size = 50              # entries per OPDS / web page
# base_path = "/library"    # only when served under a prefix by a reverse proxy
# auth_cache_seconds = 300  # successful logins are remembered this long (reader apps send credentials on every request)
# anonymous_user = "guest"  # OFF by default. Requests that send NO credentials act as this user, for reader apps
#                           # that cannot log in. Wrong credentials are still refused. Give that user few roots
#                           # and never adult = true, and do not expose this to the internet.

# EPUB metadata (title, authors, series, language, year) is read from inside each book, only for the
# books on the page being shown, and cached in a disposable SQLite file (safe to delete at any time).
# metadata = true
# cache_dir = 'D:\pluteus-cache'   # leave out to keep the cache in memory only (lost on restart)

# Folder or file names to hide anywhere (case-insensitive), on top of the built-in list
# (Recycle Bin, Thumbs.db, ...). Names starting with a dot are always hidden.
exclude = ["_incoming", "_Quarantine", "_sort", "_Trash Folder", "_Thrash"]

# File types that are listed and downloadable.
extensions = [".epub", ".cbz", ".pdf"]

# Leading numbers such as "3.23 - " or "0. " are removed from FOLDER display names
# (sorting still uses the real name). Set to "" to show names untouched.
# display_strip = '^\d+(?:\.\d+)*(?: - |\.\s+)'

# A folder containing a file with this name (and everything below it) is hidden from
# users who do not have adult = true. Hidden folders answer 404, like missing ones.
adult_marker = ".adult"

# Folders to serve. The folder tree is read live from disk; nothing is indexed up front.
# Names appear in URLs, so use letters, digits, - and _ only.
[[roots]]
name = "books"
path = 'D:\eLib\800 - Fiction'

[[roots]]
name = "comics"
path = 'E:\eLib\741.59 - Comic Books'

# Users. Manage them with the CLI instead of editing by hand:
#   python -m pluteus user add NAME --config config.toml
#   python -m pluteus user set NAME --adult | --roots books,comics | --password
#   python -m pluteus user list | remove NAME
# A running server picks up user changes within a few seconds.
[[users]]
name = "erlend"
password_hash = "scrypt$16384$8$1$replace-with-output-of-hash-password"
adult = true

[[users]]
name = "guest"
password_hash = "scrypt$16384$8$1$replace-with-output-of-hash-password"
roots = ["books"]           # omit to allow every root
