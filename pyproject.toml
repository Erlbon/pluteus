[project]
name = "bookshelf"
version = "0.1.0"
description = "Filesystem-first book and comic server: OPDS, web browsing, download"
requires-python = ">=3.11"
dependencies = ["starlette>=0.40", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
