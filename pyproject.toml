[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pluteus"
version = "0.6.0"
description = "Filesystem-first book and comic server: OPDS, web browsing, download"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.13", "mistune>=3.0", "qrcodegen>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10"]     # pillow: tests, and tools/make_icon.py

[project.scripts]
pluteus = "pluteus.__main__:main"

[project.gui-scripts]
pluteus-admin = "pluteus.admin_gui:main"

[tool.setuptools]
packages = ["pluteus"]

# The CSS, scripts, icons and built-in themes are served from inside the package, so they must ship with it.
[tool.setuptools.package-data]
pluteus = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
