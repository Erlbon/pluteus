[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pluteus"
version = "0.1.0"
description = "Filesystem-first book and comic server: OPDS, web browsing, download"
requires-python = ">=3.11"
dependencies = ["starlette>=0.40", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10"]     # pillow: tests, and tools/make_icon.py

[project.scripts]
pluteus = "pluteus.__main__:main"

[tool.setuptools]
packages = ["pluteus"]

# The CSS, scripts, icons and built-in themes are served from inside the package, so they must ship with it.
[tool.setuptools.package-data]
pluteus = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
