[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pluteus"
version = "0.9.28"
description = "Filesystem-first book and comic server: OPDS, web browsing, download"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.13", "mistune>=3.0", "qrcodegen>=1.8", "tinytag>=2.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2", "pillow>=10"]     # httpx2: Starlette's test client (plain httpx is deprecated there); pillow: tests, and tools/make_icon.py
browser = ["playwright>=1.49"]     # the tests/*_browser.py files (they skip without it); then once: python -m playwright install chromium
build = ["pyinstaller>=6"]     # the downloadable program (pluteus.spec); pinned for releases in requirements-build.lock (tools/make_lock.py)
cast =["pychromecast>=14"]     # only for casting to Google Cast devices (pluteus/castdevices.py); everything else works without it

[project.scripts]
pluteus = "pluteus.__main__:main"

[project.gui-scripts]
pluteus-admin = "pluteus.admin_gui:main"

[tool.setuptools]
packages = ["pluteus"]

# The CSS, scripts, icons and built-in themes are served from inside the package, so they must ship with it.
[tool.setuptools.package-data]
pluteus = ["static/*", "static/**/*", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
